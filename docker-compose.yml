version: '3.8'

networks:
  bss_internal:
    driver: bridge

services:

  # ── PostgreSQL Primary ──────────────────────────────────────────────────────
  postgres_primary:
    image: postgres:15-alpine
    container_name: bss_postgres_primary
    environment:
      POSTGRES_DB: isp_bss_oss
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_SECURE_PASSWORD}
    volumes:
      - pg_data_primary:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - bss_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d isp_bss_oss"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
    restart: always

  # ── Redis Primary ───────────────────────────────────────────────────────────
  redis_primary:
    image: redis:7-alpine
    container_name: bss_redis_primary
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 2gb
      --maxmemory-policy volatile-ttl
    volumes:
      - redis_primary_data:/data
    networks:
      - bss_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M
    restart: always

  # ── Redis Replica 1 ─────────────────────────────────────────────────────────
  redis_replica_1:
    image: redis:7-alpine
    container_name: bss_redis_replica_1
    command: redis-server --replicaof redis_primary 6379 --appendonly yes
    volumes:
      - redis_replica_1_data:/data
    networks:
      - bss_internal
    depends_on:
      - redis_primary
    restart: always

  # ── Redis Replica 2 ─────────────────────────────────────────────────────────
  redis_replica_2:
    image: redis:7-alpine
    container_name: bss_redis_replica_2
    command: redis-server --replicaof redis_primary 6379 --appendonly yes
    volumes:
      - redis_replica_2_data:/data
    networks:
      - bss_internal
    depends_on:
      - redis_primary
    restart: always

  # ── Redis Sentinel 1 ────────────────────────────────────────────────────────
  redis_sentinel_1:
    image: redis:7-alpine
    container_name: bss_redis_sentinel_1
    command: >
      redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./config/redis/sentinel.conf:/etc/redis/sentinel.conf
    ports:
      - "26379:26379"
    networks:
      - bss_internal
    depends_on:
      - redis_primary
      - redis_replica_1
      - redis_replica_2
    restart: always

  # ── Redis Sentinel 2 ────────────────────────────────────────────────────────
  redis_sentinel_2:
    image: redis:7-alpine
    container_name: bss_redis_sentinel_2
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./config/redis/sentinel.conf:/etc/redis/sentinel.conf
    networks:
      - bss_internal
    restart: always

  # ── Redis Sentinel 3 ────────────────────────────────────────────────────────
  redis_sentinel_3:
    image: redis:7-alpine
    container_name: bss_redis_sentinel_3
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./config/redis/sentinel.conf:/etc/redis/sentinel.conf
    networks:
      - bss_internal
    restart: always

  # ── Gotenberg PDF Engine ────────────────────────────────────────────────────
  gotenberg_engine:
    image: gotenberg/gotenberg:8
    container_name: bss_gotenberg_engine
    networks:
      - bss_internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    restart: always

  # ── AAA Core Daemon ─────────────────────────────────────────────────────────
  aaa_core_daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bss_aaa_core_daemon
    depends_on:
      postgres_primary:
        condition: service_healthy
      redis_primary:
        condition: service_healthy
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
      - "9100:9100"   # Prometheus metrics
    environment:
      - DB_DSN=host=postgres_primary user=postgres password=${DB_SECURE_PASSWORD} dbname=isp_bss_oss port=5432 sslmode=disable
      - REDIS_SENTINEL_ADDRS=bss_redis_sentinel_1:26379,bss_redis_sentinel_2:26379,bss_redis_sentinel_3:26379
      - REDIS_MASTER_NAME=${REDIS_MASTER_NAME}
      - RADIUS_SECRET=${RADIUS_SECRET}
      - AES_KEY_STORE_URL=${AES_KEY_STORE_URL}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - SMS_GATEWAY_PROVIDER=${SMS_GATEWAY_PROVIDER}
      - SMS_GATEWAY_API_KEY=${SMS_GATEWAY_API_KEY}
      - SMS_GATEWAY_SENDER_ID=${SMS_GATEWAY_SENDER_ID}
      - PAGERDUTY_ROUTING_KEY=${PAGERDUTY_ROUTING_KEY}
      - LOG_FORMAT=json
      - LOG_LEVEL=info
    networks:
      - bss_internal
    restart: always

  # ── API Service ─────────────────────────────────────────────────────────────
  # Port 8080 is intentionally not published to the host: SecD §9.7 requires
  # it be reachable only from the reverse_proxy container, which terminates
  # TLS and forwards to it over the internal network.
  api_service:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: bss_api_service
    depends_on:
      postgres_primary:
        condition: service_healthy
      redis_primary:
        condition: service_healthy
    expose:
      - "8080"
    ports:
      - "9101:9101"   # Prometheus metrics
    volumes:
      # AES_KEY_STORE_URL below points inside the container at this path.
      # config/keys/*.json is gitignored — generate it before first boot with
      # scripts/demo_up.sh, or by hand (see .env.example).
      - ./config/keys:/app/config/keys:ro
    environment:
      - DB_DSN=host=postgres_primary user=postgres password=${DB_SECURE_PASSWORD} dbname=isp_bss_oss port=5432 sslmode=disable
      - REDIS_SENTINEL_ADDRS=bss_redis_sentinel_1:26379,bss_redis_sentinel_2:26379,bss_redis_sentinel_3:26379
      - REDIS_MASTER_NAME=${REDIS_MASTER_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - AES_KEY_STORE_URL=${AES_KEY_STORE_URL}
      - GOTENBERG_URL=http://gotenberg_engine:3000
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_WEBHOOK_VERIFY_TOKEN=${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      - SMS_GATEWAY_PROVIDER=${SMS_GATEWAY_PROVIDER}
      - SMS_GATEWAY_API_KEY=${SMS_GATEWAY_API_KEY}
      - SMS_GATEWAY_SENDER_ID=${SMS_GATEWAY_SENDER_ID}
      - LOG_FORMAT=json
      - LOG_LEVEL=info
    networks:
      - bss_internal
    restart: always

  # ── Reverse Proxy (TLS termination — SecD §9.7, IDD §8.1) ───────────────────
  reverse_proxy:
    image: caddy:2-alpine
    container_name: bss_reverse_proxy
    depends_on:
      - api_service
    ports:
      - "443:443"
      - "80:80"   # ACME HTTP-01 challenge; Caddy also uses it to redirect to HTTPS
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    networks:
      - bss_internal
    restart: always

volumes:
  pg_data_primary:
  redis_primary_data:
  redis_replica_1_data:
  redis_replica_2_data:
  caddy_data:
  caddy_config:
