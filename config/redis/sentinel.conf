port 26379

# Required for a Docker-Compose deployment: sentinel's default is to expect a
# literal IP in "sentinel monitor", and current Redis (7.4+) treats a hostname
# there as a fatal config error at startup rather than resolving it — the
# container names in this compose file (redis_primary, ...) never actually
# worked without these two directives. resolve-hostnames lets sentinel resolve
# them; announce-hostnames makes sentinel tell clients (go-redis's
# FailoverClient among them) the hostname rather than a container-internal IP
# that is meaningless outside this network.
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

sentinel monitor bss_master redis_primary 6379 2
sentinel down-after-milliseconds bss_master 3000
sentinel failover-timeout bss_master 10000
sentinel parallel-syncs bss_master 1
