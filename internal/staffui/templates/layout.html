{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Operations Console</title>
<link rel="stylesheet" href="/staff/static/staffui.css">
</head>
<body>
{{if .Session.Username}}
<header class="topbar">
  <div class="brand">Operations Console</div>
  <nav>
    {{range .Sections}}
    <a href="{{.Path}}" class="{{if eq .Key $.Active}}on{{end}}">{{.Label}}</a>
    {{end}}
  </nav>
  <div class="who">
    <span class="role">{{.Session.Role}}</span>
    <span class="name">{{.Session.Username}}</span>
    <form method="post" action="/staff/logout"><button class="linkish">Sign out</button></form>
  </div>
</header>
{{end}}

<main class="wrap">
  {{if .Error}}<div class="alert bad">{{.Error}}</div>{{end}}
  {{if .Message}}<div class="alert ok">{{.Message}}</div>{{end}}
  {{template "content" .}}
</main>
</body>
</html>{{end}}
